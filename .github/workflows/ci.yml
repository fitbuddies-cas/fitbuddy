name: CI

# Runs the build and the XCTest suite on every PR into develop, on the team's
# own macOS runner (#113, ADR-9). An iOS build needs macOS and Xcode, so this
# workflow cannot fall back to a GitHub-hosted Linux runner.
on:
  # `branches` filters on the *base*: with develop alone, the weekly
  # develop -> main release PR would be the one merge without a check.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

# One self-hosted runner works through jobs serially, so superseded runs of the
# same PR are pointless queue time. Pushes are exempt: on develop every run
# shares one group, and cancelling would leave merged commits without a
# verdict — which is what a later bisect needs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build & test
    runs-on: [self-hosted, macOS, ARM64]
    # A hung simulator would otherwise hold the only runner indefinitely.
    timeout-minutes: 30
    env:
      # launchd gives the runner no shell profile, so the toolchain is pinned
      # here as well as system-wide via `xcode-select -s`.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      # Keep build output inside the workspace: the runner user's own
      # ~/Library/Developer/Xcode/DerivedData is never touched, and cleaning up
      # is one directory rather than a shared one.
      DERIVED_DATA: ${{ github.workspace }}/.derivedData
      SIMULATOR_NAME: iPhone 17

    steps:
      - uses: actions/checkout@v5

      # Fails with a readable message instead of a wall of xcodebuild output
      # when the runner lacks Xcode, the iOS runtime or the simulator.
      - name: Verify toolchain
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available | grep -q "iOS 26" \
            || { echo "::error::No iOS 26 simulator runtime installed — run: xcodebuild -downloadPlatform iOS"; exit 1; }
          xcrun simctl list devices available | grep -q "$SIMULATOR_NAME (" \
            || { echo "::error::No '$SIMULATOR_NAME' simulator — run: xcrun simctl create \"$SIMULATOR_NAME\" \"$SIMULATOR_NAME\""; exit 1; }

      # Unit tests only: the UI tests get their own job below, so a flaky
      # simulator interaction cannot block a merge on a green diff.
      - name: Test
        shell: bash
        run: |
          xcodebuild test \
            -project FitBuddy.xcodeproj \
            -scheme FitBuddy \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$DERIVED_DATA/TestResults.xcresult" \
            -enableCodeCoverage YES \
            -skip-testing:FitBuddyUITests

      # Directly after the test step on purpose: further down, a failing
      # Release build would also trigger `failure()` and upload a bundle in
      # which everything is green.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: ${{ env.DERIVED_DATA }}/TestResults.xcresult
          retention-days: 7

      # Reported, never enforced: a coverage threshold buys tests that cover
      # lines instead of tests that check behaviour.
      - name: Coverage summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Coverage'
            echo '```'
            xcrun xccov view --report --only-targets "$DERIVED_DATA/TestResults.xcresult"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Everyone builds Debug locally, TestFlight ships Release — and all of
      # Core/MockData plus the SwiftUI previews sit behind `#if DEBUG`, so the
      # non-DEBUG side of the code compiles nowhere else. The simulator
      # destination keeps this unsigned; an archive against a real device would
      # need certificates and stays out of scope.
      - name: Build Release
        shell: bash
        run: |
          xcodebuild build \
            -project FitBuddy.xcodeproj \
            -scheme FitBuddy \
            -configuration Release \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -derivedDataPath "$DERIVED_DATA"

      # The runner keeps its workspace between jobs; build output would grow
      # without bound on a machine that is also someone's desk computer.
      - name: Clean build output
        if: always()
        shell: bash
        run: rm -rf "$DERIVED_DATA"

  # Deliberately not a required check yet (#120): UI tests drive a simulator
  # and are the one suite here that can fail for reasons that have nothing to
  # do with the diff. `continue-on-error` makes this job report without
  # blocking; once it has run green for a week or two, drop that line and the
  # check becomes binding like any other.
  ui-test:
    name: UI test (onboarding)
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    # Roughly 40s of tests plus a build; well short of this, and a hung
    # simulator must not hold the only runner.
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      # Its own directory, so the two jobs cannot race on one build output when
      # the runner ever gets a sibling.
      DERIVED_DATA: ${{ github.workspace }}/.derivedDataUI
      SIMULATOR_NAME: iPhone 17

    steps:
      - uses: actions/checkout@v5

      - name: Test
        shell: bash
        run: |
          xcodebuild test \
            -project FitBuddy.xcodeproj \
            -scheme FitBuddy \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$DERIVED_DATA/UITestResults.xcresult" \
            -only-testing:FitBuddyUITests

      # More valuable here than for the unit tests: the bundle carries the
      # screenshots and the element tree from the moment the run failed, which
      # is most of what a UI-test post-mortem needs.
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: UITestResults
          path: ${{ env.DERIVED_DATA }}/UITestResults.xcresult
          retention-days: 7

      - name: Clean build output
        if: always()
        shell: bash
        run: rm -rf "$DERIVED_DATA"
